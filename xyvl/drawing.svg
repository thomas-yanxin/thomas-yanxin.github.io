<svg xmlns="http://www.w3.org/2000/svg" id="xyvl-drawing" data-plotter="" viewBox="0 0 560 440" width="560" height="440" fill="none" stroke="currentColor" stroke-width="1" stroke-opacity=".9" stroke-linejoin="round" font-family="Cal Sans, sans-serif" font-weight="400" role="img" aria-labelledby="xyvl-title xyvl-description">
  <title id="xyvl-title">xyData · xyJudge · xyVL</title>
  <desc id="xyvl-description">Hugging Face, GitHub and ModelScope feed xyData-Meta with around 45 million raw samples from over 50 datasets. The unified schema feeds xyJudge, where the Heuristic tagger and Model-as-a-Judge generate tags. Filtering and grading yield 18 million curated samples. The xyData-SFT, xyData-OPD and xyData-RL mixtures feed matching stages that start from Qwen. SFT produces Instruct. On-policy distillation uses signals from the Teacher Model and produces Instruct+. GRPO uses task rewards to produce xyVL, a Xinyuan model.</desc>
